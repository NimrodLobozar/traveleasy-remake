; Development PHP settings (layered on top of php.ini-development). Not used in production.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 21M
expose_php = Off
date.timezone = UTC

; OPcache: on for the web server, but re-checks file timestamps on every request so edits to
; controllers, routes and Blade templates show up on the next refresh (AC6).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
