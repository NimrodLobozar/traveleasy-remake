; Production PHP settings (ADR-0002 D8), layered on top of php.ini-production. The dev ini is not copied here.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
html_errors = Off
memory_limit = 128M
; Matches the 2 MB request body cap in the Caddyfile (no uploads in v1).
post_max_size = 2M
upload_max_filesize = 2M
date.timezone = UTC
session.cookie_httponly = 1

opcache.enable = 1
opcache.enable_cli = 0
; The code is read-only and changes only with a new image, so never re-stat files.
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
