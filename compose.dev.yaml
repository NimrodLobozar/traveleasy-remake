# TravelEasy: development overrides. Never used in production.
#
# Loaded together with compose.yaml through COMPOSE_FILE in .env, or explicitly:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#
# - Source is bind-mounted; `app` serves PHP (changes visible on refresh), `vite` serves assets with HMR.
# - vendor/ and node_modules/ come from the image as ANONYMOUS volumes over the bind mount, so they
#   never land on Windows. `docker compose up -d --build -V` renews them; the named DB volume stays.
# - Ports are published on 127.0.0.1 only (the dev server and /_inertia/devtools are unauthenticated).
# - Optional tools run behind profiles: `docker compose --profile tools up -d` starts Adminer.

# Shared definition for every container that runs the dev image (app, vite and, later, an `ssr`
# profile service): add a service with `<<: *dev-image` and its own command/ports/environment.
# Only `app` has a `build:` section, so the image is built once; the others reuse the local tag.
x-dev-image: &dev-image
    image: traveleasy-remake-dev:local
    init: true
    restart: unless-stopped
    volumes:
        - .:/var/www/html
        # Anonymous volumes: filled from the image, hide the (empty) host folders.
        - /var/www/html/vendor
        - /var/www/html/node_modules

services:
    db:
        volumes:
            # Creates the `traveleasy_test` database on first initialisation of the volume (dev/test only).
            - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

    app:
        <<: *dev-image
        build:
            context: .
            target: dev
        environment:
            CONTAINER_ROLE: app
            # Run pending migrations when the container starts (never seeds). Set to false in .env to disable.
            MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
            # Lets `php artisan serve` handle parallel requests (requires --no-reload; Laravel still reads
            # .env on every request, so .env edits apply without a restart).
            PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
        command:
            [
                'php',
                'artisan',
                'serve',
                '--host=0.0.0.0',
                '--port=8000',
                '--no-reload',
            ]
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:8000'
        networks:
            - default
            - backend
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-fsS',
                    '-o',
                    '/dev/null',
                    'http://127.0.0.1:8000/up',
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 90s

    vite:
        <<: *dev-image
        pull_policy: never
        environment:
            CONTAINER_ROLE: vite
            # Read by vite.config.ts. Inside the container Vite listens on all interfaces; the browser reaches it
            # through the 127.0.0.1-only published port, so asset URLs use http://localhost:<VITE_PORT>.
            VITE_HOST: 0.0.0.0
            VITE_PORT: ${VITE_PORT:-5173}
            VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
            VITE_POLLING_INTERVAL: ${VITE_POLLING_INTERVAL:-1000}
        command: ['npm', 'run', 'dev']
        ports:
            # Same port inside and outside, so the URL Vite advertises (hot file, HMR socket) matches.
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        networks:
            - default
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fsS -o /dev/null "http://127.0.0.1:$${VITE_PORT}/@vite/client"',
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 60s

    e2e:
        # Playwright + axe browser tests (TE-005), opt-in and one-shot: `docker compose run --rm e2e`.
        # Runs `npm run test:e2e` in Chromium; extra args replace the command, e.g.
        # `docker compose run --rm e2e npx playwright test --config tests/e2e/playwright.config.ts --output=test-results/e2e smoke`.
        #
        # VERSION SYNC: the image tag MUST equal @playwright/test in package.json/package-lock.json (pinned
        # exactly). Bump both in one commit; tests/Unit/PlaywrightImageVersionSyncTest.php fails otherwise.
        image: mcr.microsoft.com/playwright:v1.64.0-noble
        profiles: ['e2e']
        # Shares vite's network namespace: localhost:5173 is the real Vite dev server, so the page's JS really
        # loads (the asset URLs in public/hot point at http://localhost:5173). Playwright's global setup
        # forwards localhost:8000 to app:8000 (E2E_FORWARD), so the browser keeps the same origins as on the
        # host. vite is on the `default` network only, so this container cannot reach the database.
        network_mode: 'service:vite'
        # Source READ-ONLY, so the container can't change code or .git (no hook injection into Windows git):
        # - `.:/var/www/html:ro` replaces the repo bind that volumes_from brings in. (Compose drops the mode
        #   of `volumes_from: [vite:ro]`, verified on Compose 5.5.1, so the read-only root is set explicitly.)
        # - volumes_from adds vite's node_modules (same image and lockfile, includes @playwright/test) and
        #   vendor. Those volumes are mounted rw, but they are owned by uid 1000 (755) and this container runs
        #   as uid 1001 without capabilities, so it can only read them.
        volumes_from:
            - vite
        volumes:
            - .:/var/www/html:ro
            # The only writable binds: Playwright's reports, so they open on Windows (both git-ignored).
            - ./playwright-report:/var/www/html/playwright-report
            - ./test-results:/var/www/html/test-results
            # Secrets masking: the tests only need the base URL. Every `.env*` file in the repo root except
            # .env.example gets an empty read-only mask here; the compose contract test fails when one is
            # missing, so add a mask when you add such a file (only existing files can be masked).
            - type: bind
              source: /dev/null
              target: /var/www/html/.env
              read_only: true
        # Empty tmpfs over runtime state that can hold secrets or personal data: storage/ (logs, sessions,
        # private uploads) and bootstrap/cache (a cached config contains the resolved .env values).
        tmpfs:
            - /var/www/html/storage:size=1m
            - /var/www/html/bootstrap/cache:size=1m
            - /tmp
        working_dir: /var/www/html
        # uid 1001 = `pwuser` in the image: NOT the owner (1000) of node_modules/vendor, so it can't write them.
        # The report folders are created by Docker on NTFS (world-writable, owned by you on Windows). If a run
        # fails with EACCES on them, delete both folders from Windows and run again.
        user: '1001:1001'
        init: true
        # Chromium needs more than Docker's 64 MB /dev/shm; a larger shm avoids sharing the host IPC
        # namespace (`ipc: host`).
        shm_size: '1gb'
        read_only: true
        cap_drop: ['ALL']
        security_opt: ['no-new-privileges:true']
        # Only what the tests need. No env_file: nothing from .env reaches this container.
        environment:
            E2E_BASE_URL: http://localhost:8000
            E2E_FORWARD: 8000=app:8000
            NPM_CONFIG_UPDATE_NOTIFIER: 'false'
            HOME: /tmp
            # Playwright deletes and recreates its output folders, which fails on a mount point under the
            # read-only repo (EROFS). So both outputs go one level down, inside the writable binds:
            # the HTML report to playwright-report/html (this variable beats the config) and traces/screenshots
            # to test-results/e2e (`--output` below; add it to custom commands too).
            PLAYWRIGHT_HTML_OUTPUT_DIR: /var/www/html/playwright-report/html
        command: ['npm', 'run', 'test:e2e', '--', '--output=test-results/e2e']
        depends_on:
            app:
                condition: service_healthy
            vite:
                condition: service_healthy

    adminer:
        # Dev-only database GUI, opt-in: `docker compose --profile tools up -d`.
        # No credentials are stored here; log in with DB_USERNAME / DB_PASSWORD / DB_DATABASE from .env.
        image: adminer:6.1.1
        profiles: ['tools']
        restart: unless-stopped
        environment:
            # Only pre-fills the server field on the login page.
            ADMINER_DEFAULT_SERVER: db
            # Plugin bundled in the image: disables Adminer's version check, which otherwise calls
            # https://www.adminer.org/version/ from the browser (no external requests in dev tools either).
            ADMINER_PLUGINS: version-noverify
        ports:
            - '127.0.0.1:${ADMINER_PORT:-8081}:8080'
        networks:
            - default
            - backend
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
