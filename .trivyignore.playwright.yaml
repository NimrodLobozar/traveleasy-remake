      statement: 'apt packages in the pinned Playwright image. Fixed upstream in apt 3.0.4, but Microsoft has not rebuilt v1.65.0-noble. Not reachable: e2e does no package installs from untrusted sources. Local e2e container only.'
      expired_at: 2026-12-15
    - id: CVE-2026-109869
      purls:
