# Reviewed Trivy exceptions for the Playwright image only (TE-045): mcr.microsoft.com/playwright (Ubuntu 24.04), scanned by
# scan-weekly.yml. The production scan, the dev scan and the shared .trivyignore.yaml never use this file.
# Every purl is exact. Every entry expires 2026-12-15; re-check before then (look for a rebuilt v1.65.x-noble or v1.66 image).
# Reviewed 2026-11-10: Microsoft has not rebuilt v1.65.0-noble (digest unchanged); the pin is tied to @playwright/test 1.65.0.
# The image runs only in the local e2e container, against the local dev app, never on the server.
vulnerabilities:
    - id: CVE-2025-3887
      purls:
          - pkg:deb/ubuntu/gstreamer1.0-plugins-bad
          - pkg:deb/ubuntu/libgstreamer-plugins-bad1.0-0
      statement: 'GStreamer packages in the pinned Playwright image (Ubuntu 24.04); no fixed Ubuntu package is available yet. Not reachable: e2e never decodes untrusted media. Local e2e container only.'
      expired_at: 2026-12-15
    - id: CVE-2026-102276
      purls:
          - pkg:npm/brace-expansion@5.0.9
      statement: 'npm bundled in the Playwright image (global npm, not the app or test dependencies); no fixed release in the pinned image yet. Local e2e container only.'
      expired_at: 2026-12-15
    - id: CVE-2026-102278
      purls:
          - pkg:npm/brace-expansion@5.0.9
