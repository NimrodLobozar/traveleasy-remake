# Reviewed Trivy exceptions (TE-014, migrated to per-image scope in TE-036).
# Used ONLY by the production image scan (.github/workflows/ci.yml). scan-weekly.yml does not use this file, so a finding
# accepted here is not accepted for the dev or Playwright (Ubuntu) images.
# Scope: every entry has `purls`. Debian OS packages are limited to pkg:deb/debian (the production base is Debian 13, the
# Playwright image is Ubuntu); the FrankenPHP finding is limited to its Go module.
# Every entry expires 2026-12-15 (Trivy stops ignoring it after that date, so the scan fails again). Re-check at expiry.
# Reviewed 2026-11-03 (security-privacy-reviewer): no fixed Debian/upstream package, not reachable in the runtime (uid 10001,
# cap_drop ALL, no-new-privileges, Caddy auto_https/admin off, no XML parsing of untrusted input, no outbound HTTP yet).
# Re-check reachability when the app starts parsing XML or calling external APIs (M8/M9).
