# Reviewed Trivy exceptions (TE-014, migrated to per-image scope in TE-036).
# Used by the production image scan (.github/workflows/ci.yml) and the weekly scan of the dev image (same Debian 13 base,
# scan-weekly.yml). The Playwright (Ubuntu) image is scanned without this file, so nothing accepted here applies to it.
# Scope: every entry has `purls`. Trivy matches an ignore purl against the package purl, so a namespace-only purl
# (pkg:deb/debian) matches nothing. Each Debian entry therefore lists the exact affected binary packages as
# pkg:deb/debian/<package> (taken from a Trivy 0.76.1 scan of the production image, 2026-11-09); a pkg:deb/ubuntu package
# (the Playwright image) never matches. pkg:deb/debian/* is the only allowed fallback and is not used. The FrankenPHP
# finding is limited to its Go module. When a new binary package shows up for an accepted CVE, add it here.
# Every entry expires 2026-12-15 (Trivy stops ignoring it after that date, so the scan fails again). Re-check at expiry.
# Reviewed 2026-11-03 (security-privacy-reviewer): no fixed Debian/upstream package, not reachable in the runtime (uid 10001,
# cap_drop ALL, no-new-privileges, Caddy auto_https/admin off, no XML parsing of untrusted input, no outbound HTTP yet).
# Re-check reachability when the app starts parsing XML or calling external APIs (M8/M9).
vulnerabilities:
