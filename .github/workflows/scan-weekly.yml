# Weekly vulnerability scan of the dev image and the Playwright image (TE-014 AC5). A failing scan makes the
# scheduled run red; it never blocks pushes to main (the release job scans the production image on every build).
name: Weekly scan

on:
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

env:
    TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
    scan:
        name: Trivy (dev image, Playwright image)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build the dev image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: dev
                  load: true
                  push: false
                  tags: traveleasy-remake-dev:local
              env:
                  DOCKER_BUILD_RECORD_UPLOAD: 'false'
                  DOCKER_BUILD_SUMMARY: 'false'
            - name: Pull the Playwright image (the pinned reference from compose.dev.yaml)
              run: |
                  ref="$(grep -oE 'mcr\.microsoft\.com/playwright:[^ ]+' compose.dev.yaml | head -n 1)"
                  echo "PLAYWRIGHT_IMAGE=$ref" >> "$GITHUB_ENV"
                  docker pull "$ref"
            - name: Trivy scan of both images (High and Critical fail the run; the dev image uses .trivyignore.yaml, the Playwright image none, TE-036)
              run: |
                  status=0
                  for image in traveleasy-remake-dev:local "$PLAYWRIGHT_IMAGE"; do
                      echo "== $image"
                      # Debian dev image shares the production base: reviewed ignores apply. Ubuntu Playwright image: none.
                      ignore=""
                      [ "$image" = traveleasy-remake-dev:local ] && ignore="--ignorefile .trivyignore.yaml"
                      docker run --rm --user root -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
                          "$TRIVY_IMAGE" image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
                          --exit-code 1 "$image" || status=1
                  done
                  exit "$status"
